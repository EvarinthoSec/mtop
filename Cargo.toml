[package]
name = "mtop"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85.0"
description = "A cross-platform terminal system monitor for Linux, macOS, and BSD-family systems."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/EvarinthoSec/mtop"
documentation = "https://docs.rs/mtop"

[features]
gpu-nvidia = ["dep:nvml-wrapper"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
libc = "0.2"
ratatui = "0.30.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39.6"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "0.9"

[dependencies.nvml-wrapper]
version = "0.13"
optional = true
