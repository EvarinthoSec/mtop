[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/EvarinthoSec/mtop"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
libc = "0.2"
ratatui = "0.30.2"
ratatui-ratty = { git = "https://github.com/orhun/ratty", rev = "e3b8f93906f453123f544779b6712e128c3d3fb4", package = "ratatui-ratty" }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39.6"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "0.9"
windows-sys = "0.61.2"
