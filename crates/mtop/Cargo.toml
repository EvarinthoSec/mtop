[package]
name = "mtop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A cross-platform terminal system monitor for Linux, macOS, Windows, and BSD-family systems."
readme = "../../README.md"

[features]
default = []
gpu-nvidia = ["mtop-platform/gpu-nvidia"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
mtop-config = { path = "../config" }
mtop-core = { path = "../core" }
mtop-platform = { path = "../platform" }
mtop-runtime = { path = "../runtime" }
mtop-tui = { path = "../tui" }

[dev-dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
libc.workspace = true
ratatui.workspace = true
regex.workspace = true
serde.workspace = true
sysinfo.workspace = true
toml.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mtop"
path = "src/main.rs"
