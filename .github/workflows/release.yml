name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version-check:
    name: Verify release tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to mtop package version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mtop"))')
          if [ "$tag_version" != "$package_version" ]; then
            printf 'tag version %s does not match Cargo package version %s\n' "$tag_version" "$package_version" >&2
            exit 1
          fi

  build-deb:
    name: Build Debian package (amd64)
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --locked --release --package mtop
      - name: Smoke-test binary
        run: target/release/mtop --once
      - name: Package .deb
        run: sh packaging/build-deb.sh "${GITHUB_REF_NAME#v}" amd64
      - name: Validate Debian package contents
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: dist/*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM package (x86_64)
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --locked --release --package mtop
      - name: Build RPM
        run: |
          set -euo pipefail
          cargo install cargo-generate-rpm --version 0.21.0 --locked
          version="${GITHUB_REF_NAME#v}"
          rpm_version=$(python3 -c 'import sys; print(sys.argv[1].replace("-", "~", 1))' "$version")
          mkdir -p dist
          cargo generate-rpm --package crates/mtop \
            --set-metadata "version = \"${rpm_version}\"" \
            --auto-req disabled \
            --output dist
          sudo apt-get update
          sudo apt-get install --yes rpm
          rpm --query --package --info dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-rpm-x86_64
          path: dist/*.rpm
          if-no-files-found: error

  build-arch:
    name: Build Arch Linux package (x86_64)
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render checksummed PKGBUILD and build package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          curl --fail --location --retry 3 "$source_url" --output "$RUNNER_TEMP/mtop-source.tar.gz"
          source_sha=$(sha256sum "$RUNNER_TEMP/mtop-source.tar.gz" | cut -d ' ' -f 1)
          mkdir -p dist/arch
          python3 packaging/arch/render_pkgbuild.py \
            --version "$version" \
            --source-sha256 "$source_sha" \
            --output dist/arch/PKGBUILD
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/dist/arch \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed archlinux-keyring rust cargo git
              useradd --create-home builder
              chown -R builder:builder /workspace/dist/arch
              su builder -s /bin/bash -c "cd /workspace/dist/arch && makepkg --cleanbuild --noconfirm"
              pacman -Qip /workspace/dist/arch/mtop-*.pkg.tar.zst
              pacman -U --noconfirm /workspace/dist/arch/*.pkg.tar.zst
              /usr/bin/mtop --version
            '
          cp dist/arch/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  build-alpine:
    name: Build Alpine APK package (x86_64)
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build APK in Alpine Linux
        run: |
          set -euo pipefail
          mkdir -p dist/alpine
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/dist/alpine:/output" \
            -w /workspace alpine:latest sh \
            packaging/alpine/build-apk.sh "${GITHUB_REF_NAME#v}" /workspace /output
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-alpine-x86_64
          path: |
            dist/alpine/*.apk
            dist/alpine/*.rsa.pub
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --package mtop --target "${{ matrix.target }}"
      - name: Package binary archive
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          install -m 0755 "target/${{ matrix.target }}/release/mtop" dist/stage/mtop
          tar -C dist/stage -czf "dist/mtop-${{ matrix.target }}.tar.gz" mtop
          rm -rf dist/stage
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/mtop-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: [version-check, build-deb, build-rpm, build-arch, build-alpine, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate Homebrew formula and checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arm64_sha=$(sha256sum dist/mtop-aarch64-apple-darwin.tar.gz | cut -d ' ' -f 1)
          x86_64_sha=$(sha256sum dist/mtop-x86_64-apple-darwin.tar.gz | cut -d ' ' -f 1)
          python3 packaging/homebrew/render_formula.py \
            --version "$version" \
            --arm64-sha256 "$arm64_sha" \
            --x86-64-sha256 "$x86_64_sha" \
            --output dist/mtop.rb
          ruby -c dist/mtop.rb
          (cd dist && sha256sum mtop_*.deb *.rpm *.pkg.tar.zst *.apk *.rsa.pub mtop-*.tar.gz mtop.rb > SHA256SUMS)
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
